<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reference A2UI Agent</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f0f2f5;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 350px;
    }
    h1 { font-size: 1.25rem; margin: 0; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h1>AI Voice Assistant</h1>
    
    <!-- Minimal State Orchestration -->
    <ui-speech-provider simulation id="speech-prov">
      <div style="display: flex; align-items: center; gap: 12px; background: #f8f9fa; padding: 12px; border-radius: 100px;">
        <ui-speech-record-button size="sm"></ui-speech-record-button>
        <ui-voice-waveform height="24"></ui-voice-waveform>
        <ui-speech-cancel-button></ui-speech-cancel-button>
      </div>
    </ui-speech-provider>

    <div style="border-top: 1px solid #eee; padding-top: 1.5rem;">
      <ui-audio-provider id="audio-prov">
        <ui-audio-player-error></ui-audio-player-error>
        <div style="display: flex; align-items: center; gap: 12px;">
          <ui-audio-play-button></ui-audio-play-button>
          <ui-audio-progress-slider></ui-audio-progress-slider>
        </div>
      </ui-audio-provider>
    </div>
  </div>

  <script type="module">
    import '@ghchinoy/lit-audio-ui';
    
    const speechProv = document.getElementById('speech-prov');
    const audioProv = document.getElementById('audio-prov');

    // Simulate Agent behavior: When recording stops, "reply" with audio
    speechProv.addEventListener('speech-stop', () => {
      console.log('User finished speaking. Agent is thinking...');
      
      setTimeout(() => {
        audioProv.src = 'https://storage.googleapis.com/scream-ui-samples/speech_sample-Aoede-20260212-183352.wav';
        audioProv.play();
      }, 1000);
    });
  </script>
</body>
</html>
